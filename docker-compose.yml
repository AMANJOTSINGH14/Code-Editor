version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: collab-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  chromadb:
    image: chromadb/chroma:latest
    container_name: collab-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
  server:
    build:
      context: ./server
    container_name: collab-server
    env_file:
      - .env
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/collab
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chromadb:8000
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
  client:
    build:
      context: ./client
    container_name: collab-client
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_SOCKET_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
volumes:
  mongo_data:
  redis_data:
  chroma_data:
